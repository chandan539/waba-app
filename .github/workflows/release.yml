name: Publish WABA update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const read = name => JSON.parse(readFileSync(name, 'utf8'))
          const version = read('src/lib/wabaVersion.json').version
          assert.match(version, /^\d+\.\d+\.\d+$/)
          assert.equal(read('package.json').version, version)
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`)
          JS
      - run: npm run check

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
